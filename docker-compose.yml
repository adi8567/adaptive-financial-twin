version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: adaptive_twin_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - IS_DEMO=true
      - DATABASE_URL=sqlite:///./financial_twin.db
    volumes:
      - .:/app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: adaptive_twin_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
